[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-intelligence-engine"
version = "0.2.0"
description = "Production-grade LLM-agnostic Legal AI Platform for Arabic legal retrieval"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "H Elhabbal" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
gpu = ["faiss-gpu"]
lmdb = ["lmdb>=1.4"]
mlops = [
    "dvc[gdrive]>=3.0",
    "mlflow>=2.16",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "streamlit>=1.36",
    "dvc[gdrive]>=3.0",
    "mlflow>=2.16",
]

[project.scripts]
legal-rag = "legal_rag_engine:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN"]
ignore = [
    "ANN001",
    "ANN101",
    "ANN102",
    "ANN201",
    "ANN202",
    "ANN401",
    "E501",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
mypy_path = ["src"]
explicit_package_bases = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
