# Example Streamlit secrets template
# Copy this file to .streamlit/secrets.toml (or set values via Streamlit Cloud UI:
# App -> Settings -> Secrets) and fill with real keys.
#
# app.py reads these automatically via a unified _get_secret() helper and
# pre-fills the sidebar with them, so once these are set here you do NOT
# need to re-type API keys into the UI on every visit.

# Google Generative Language (Gemini)
GOOGLE_API_KEY = "<your-google-api-key>"
GEMINI_MODEL = "gemini-2.5-flash"

# OpenAI (optional)
OPENAI_API_KEY = "<your-openai-api-key>"
OPENAI_MODEL = "gpt-5-mini"

# Local runtime: keep disabled on Streamlit Cloud
ALLOW_LOCAL_MODEL_RUNTIME = "0"

# Custom backend (FastAPI) if using a self-hosted model service
LEGAL_API_URL = "https://your-backend.example.com/query"

# DVC remote
DVC_REMOTE_URL = "gs://your-bucket/path-or-s3://your-bucket/path"

# Monitoring / Logging
SENTRY_DSN = ""
LOGFLARE_SOURCE_TOKEN = ""

# Hugging Face token (for private model downloads)
HF_TOKEN = ""
